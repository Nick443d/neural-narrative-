# Clonez le repo
git clone https://github.com/Nick443d/neural-narrative-.git
cd neural-narrative-

# Créez le dossier et le fichier
mkdir -p .github/workflows
cat > .github/workflows/deploy-pages.yml << 'EOF'
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
EOF

# Commitez et poussez
git add .github/workflows/deploy-pages.yml
git commit -m "ci: add GitHub Pages automatic deployment workflow"
git push origin main
